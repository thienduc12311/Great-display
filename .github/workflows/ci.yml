name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (universal)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Select newest Xcode
        run: ./Scripts/ci_select_xcode.sh

      - name: Build app
        env:
          ARCHS: arm64 x86_64
          SIGN_IDENTITY: "-"
          VERSION: 0.0.0-ci.${{ github.run_number }}
          BUILD_NUMBER: ${{ github.run_number }}
          REQUIRE_VALID_SIGNATURE: "1"
        run: ./Scripts/build_app.sh release

      - name: Check bundle
        run: |
          lipo -info dist/GreatDisplay.app/Contents/MacOS/GreatDisplay
          plutil -lint dist/GreatDisplay.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/GreatDisplay.app

      # The build alone only proves the app compiles. Running it catches a
      # binary that fails at launch, and checks the command line dispatch.
      - name: Smoke test
        run: |
          APP=dist/GreatDisplay.app/Contents/MacOS/GreatDisplay
          "${APP}" --help
          "${APP}" --probe
          if "${APP}" --no-such-command; then
            echo "::error::an unknown command must exit with a non-zero status"
            exit 1
          fi
          for HOLD in inf -inf nan invalid; do
            STATUS=0
            "${APP}" --create-virtual 1920 1080 "${HOLD}" || STATUS=$?
            if [ "${STATUS}" -ne 2 ]; then
              echo "::error::invalid hold duration ${HOLD} must exit 2 (got ${STATUS})"
              exit 1
            fi
          done

      - name: Package
        env:
          VERSION: 0.0.0-ci.${{ github.run_number }}
        run: ./Scripts/package_release.sh

      - name: Upload build
        uses: actions/upload-artifact@v6
        with:
          name: GreatDisplay-ci-${{ github.run_number }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 14
