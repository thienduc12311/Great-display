name: Release

# Publishes a GitHub release when a version tag is pushed:
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# The release notes come from the matching "## [1.2.3]" section of
# CHANGELOG.md, followed by GitHub's generated list of merged pull requests.
# Tags with a hyphen (v1.2.3-beta.1) are published as pre-releases.
#
# Signing and notarization are optional. Without the secrets below the app is
# ad-hoc signed and users confirm it once in Privacy & Security. With them it
# is signed with a Developer ID certificate, notarized and stapled:
#
#   MACOS_CERTIFICATE_P12       base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  password of that .p12
#   MACOS_SIGN_IDENTITY         e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID                    Apple ID used for notarization
#   APPLE_TEAM_ID               10-character team ID
#   APPLE_APP_PASSWORD          app-specific password for that Apple ID

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build and publish, e.g. v1.0.0
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-26
    timeout-minutes: 45
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # Pinned to a commit: this job holds a write-scoped token and the signing
      # and notarization secrets, so a retargeted tag must not change what runs.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          # Publishing goes through GH_TOKEN; later steps only read local
          # history, so the token is not left in the checkout's git config.
          persist-credentials: false

      - name: Resolve version
        run: |
          VERSION="${TAG#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag ${TAG} is not a version tag (expected vX.Y.Z)"
            exit 1
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          if [[ "${VERSION}" == *-* ]]; then
            echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
          fi

      - name: Select newest Xcode
        run: ./Scripts/ci_select_xcode.sh

      - name: Import signing certificate
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: |
          if [[ -z "${P12}" || -z "${IDENTITY}" ]]; then
            echo "No signing secrets; building ad-hoc signed."
            echo "SIGN_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          echo "${P12}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security import "$RUNNER_TEMP/cert.p12" -P "${P12_PASSWORD}" \
            -A -t cert -f pkcs12 -k "${KEYCHAIN}"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" >/dev/null
          security list-keychains -d user -s "${KEYCHAIN}" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          echo "SIGN_IDENTITY=${IDENTITY}" >> "$GITHUB_ENV"
          echo "SIGNED=1" >> "$GITHUB_ENV"

      - name: Build app
        env:
          ARCHS: arm64 x86_64
          REQUIRE_VALID_SIGNATURE: "1"
        run: ./Scripts/build_app.sh release

      - name: Notarize app
        if: env.SIGNED == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          if [[ -z "${APPLE_ID}" || -z "${APPLE_TEAM_ID}" || -z "${APPLE_APP_PASSWORD}" ]]; then
            echo "::warning::Signed but not notarized (APPLE_ID / APPLE_TEAM_ID / APPLE_APP_PASSWORD missing)."
            exit 0
          fi
          ditto -c -k --keepParent dist/GreatDisplay.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" --wait
          xcrun stapler staple dist/GreatDisplay.app
          echo "NOTARIZED=1" >> "$GITHUB_ENV"

      - name: Package
        run: ./Scripts/package_release.sh

      - name: Notarize disk image
        if: env.NOTARIZED == '1'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="dist/GreatDisplay-${VERSION}.dmg"
          xcrun notarytool submit "${DMG}" \
            --apple-id "${APPLE_ID}" --team-id "${APPLE_TEAM_ID}" \
            --password "${APPLE_APP_PASSWORD}" --wait
          xcrun stapler staple "${DMG}"
          (cd dist && shasum -a 256 "GreatDisplay-${VERSION}.dmg" "GreatDisplay-${VERSION}.zip" > SHA256SUMS.txt)

      - name: Write release notes
        run: ./Scripts/release_notes.sh "${VERSION}" > "$RUNNER_TEMP/notes.md"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSETS=(
            "dist/GreatDisplay-${VERSION}.dmg"
            "dist/GreatDisplay-${VERSION}.zip"
            "dist/SHA256SUMS.txt"
          )
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ASSETS[@]}" --clobber
            gh release edit "${TAG}" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "${TAG}" "${ASSETS[@]}" \
              --title "Great Display ${VERSION}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --generate-notes \
              --verify-tag ${PRERELEASE:-}
          fi

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
